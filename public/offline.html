<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      :root { --page: #f6f7fb; --ink: #0f172a; --muted: #64748b; --accent: #4f46e5; }
      @media (prefers-color-scheme: dark) {
        :root { --page: #0b0f1a; --ink: #e8ecf5; --muted: #94a3b8; --accent: #6366f1; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center; background: var(--page); color: var(--ink);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .icon {
        width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px;
        display: flex; align-items: center; justify-content: center;
        background: var(--accent); color: #fff;
      }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
      p { margin: 0 auto 24px; max-width: 280px; font-size: 14px; line-height: 1.5; color: var(--muted); }
      button {
        border: 0; border-radius: 16px; padding: 14px 28px; font-size: 16px; font-weight: 600;
        color: #fff; background: var(--accent); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8.8a15 15 0 0 1 20 0" />
          <path d="M5 12.5a10 10 0 0 1 14 0" />
          <path d="M8.5 16a5 5 0 0 1 7 0" />
          <path d="M12 20h.01" />
          <path d="m3 3 18 18" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>This page isn't saved on your device yet. Pages you've already opened still work offline.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
